<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадастрова карта</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<style>
html,body,#map{width:100%;height:100%;margin:0;}
#panel{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:#fff;
padding:10px;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
gap:6px;
}
button{
padding:6px 10px;
border:none;
border-radius:6px;
background:#3b82f6;
color:#fff;
cursor:pointer;
font-size:13px;
}
button:hover{background:#2563eb;}
#info{
position:absolute;
top:10px;
right:10px;
z-index:1000;
width:320px;
background:#fff;
padding:12px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.25);
display:none;
}
#info.visible{display:block;}
#info table{width:100%;}
#info td:first-child{width:120px;font-weight:600;}
td.value{
background:#f1f5f9;
padding:4px 6px;
border-radius:4px;
}
td.value.active{
background:#dbeafe;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">
<button id="addBtn">Додати</button>
<button id="editBtn">Редагувати</button>
<button id="deleteBtn">Видалити</button>
<input id="searchInput" placeholder="Пошук">
<button id="coordsBtn">Координати</button>
</div>

<div id="info">
<div style="display:flex;justify-content:space-between;">
<b>Інформація</b>
<button id="closeInfo">✖</button>
</div>
<div id="infoContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-geometryutil@0.10.1/src/leaflet.geometryutil.js"></script>

<script>

const map=L.map('map').setView([48.680987,31.086159],12);

L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

const editableLayer=new L.FeatureGroup().addTo(map);

let activeLayer=null;
let coordsMode=false;

/* ===== Кадастровий номер ===== */

function generateCadnum(){
return `3523681200:${Math.floor(Math.random()*100000000)
.toString()
.padStart(8,'0')}`;
}

/* ===== Стиль ===== */

function stylePolygon(){
return {color:'#3388ff',fillColor:'#3388ff',fillOpacity:0.2};
}

/* ===== Завантаження ===== */

fetch('/polygons.json')
.then(r=>r.json())
.then(data=>{
if(!data || !data.features) return;
L.geoJSON(data,{
style:stylePolygon,
onEachFeature:(f,l)=>{
editableLayer.addLayer(l);
l.on('click',()=>selectLayer(l));
}
});
});

/* ===== Додавання ===== */

const drawControl=new L.Draw.Polygon(map,{
allowIntersection:false,
shapeOptions:stylePolygon()
});

document.getElementById('addBtn').onclick=()=>drawControl.enable();

map.on(L.Draw.Event.CREATED,e=>{
const layer=e.layer;
const ll=layer.getLatLngs()[0];

layer.feature={
type:'Feature',
properties:{
Cadnum:generateCadnum(),
Area_doc:'',
area_2:+(L.GeometryUtil.geodesicArea(ll)/10000).toFixed(4),
Owner:'',
Purpose:'',
Note:''
},
geometry:{
type:'Polygon',
coordinates:[ll.map(p=>[p.lng,p.lat])]
}
};

editableLayer.addLayer(layer);
selectLayer(layer);
saveAll();
});

/* ===== Вибір ===== */

function selectLayer(layer){
activeLayer=layer;
editableLayer.eachLayer(l=>l.setStyle(stylePolygon()));
layer.setStyle({fillColor:'#ffe066',fillOpacity:0.5});
showInfo(layer);
}

/* ===== Панель атрибутів ===== */

function showInfo(layer){
const p=layer.feature.properties;

let html='<table>';

for(const key in p){
html+=`
<tr>
<td>${key}</td>
<td class="value" contenteditable="${key!=='Cadnum'}" data-key="${key}">
${p[key]}
</td>
</tr>
`;
}

html+='</table>';

document.getElementById('infoContent').innerHTML=html;
document.getElementById('info').classList.add('visible');

document.querySelectorAll('.value').forEach(td=>{
td.onblur=()=>{
const k=td.dataset.key;
layer.feature.properties[k]=td.innerText.trim();
saveAll();
};
});
}

document.getElementById('closeInfo').onclick=()=>{
document.getElementById('info').classList.remove('visible');
};

/* ===== Редагування геометрії ===== */

document.getElementById('editBtn').onclick=()=>{
if(!activeLayer) return;
if(!activeLayer.editing.enabled()){
activeLayer.editing.enable();
}else{
activeLayer.editing.disable();
const ll=activeLayer.getLatLngs()[0];
activeLayer.feature.properties.area_2=
+(L.GeometryUtil.geodesicArea(ll)/10000).toFixed(4);
showInfo(activeLayer);
saveAll();
}
};

/* ===== Видалення ===== */

document.getElementById('deleteBtn').onclick=()=>{
if(activeLayer){
editableLayer.removeLayer(activeLayer);
document.getElementById('info').classList.remove('visible');
activeLayer=null;
saveAll();
}
};

/* ===== Пошук ===== */

document.getElementById('searchInput').oninput=e=>{
const q=e.target.value.toLowerCase();
editableLayer.eachLayer(l=>{
const match=Object.values(l.feature.properties)
.some(v=>v && v.toString().toLowerCase().includes(q));
l.setStyle(match?{fillColor:'#22c55e',fillOpacity:0.6}:stylePolygon());
});
};

/* ===== Координати ===== */

document.getElementById('coordsBtn').onclick=()=>{
coordsMode=!coordsMode;
map.getContainer().style.cursor=coordsMode?'crosshair':'';
};

map.on('click',e=>{
if(!coordsMode) return;
alert(e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6));
});

/* ===== Збереження ===== */

function saveAll(){
fetch('/polygons',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(editableLayer.toGeoJSON())
});
}

</script>
</body>
</html>
