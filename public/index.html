<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадастрова карта</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<style>
:root { --btn-base:#5aa0e5; --btn-hover:#3f7fc1; --btn-active:#f59e0b; }
html,body,#map{width:100%;height:100%;margin:0;}

#infoPanel{
position:absolute;top:15px;right:15px;width:380px;
background:#fff;padding:14px;border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
font-size:14px;z-index:1000;display:none;
}
#infoPanel.visible{display:block;}
#infoHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
#infoContent table{width:100%;border-collapse:separate;border-spacing:0 6px;}
#infoContent td:first-child{width:160px;font-weight:500;}
td.value{background:#f0f4ff;padding:6px 8px;border-radius:6px;}
td.value.active{background:#dbeafe;}

button{
border:none;border-radius:6px;padding:6px 10px;
background:var(--btn-base);color:#fff;
cursor:pointer;font-size:13px;
}
button:hover{background:var(--btn-hover);}
button.active{background:var(--btn-active);}

.editBtn{
background:#94a3b8;
padding:4px 6px;
display:flex;
align-items:center;
justify-content:center;
}
.editBtn:hover{background:#64748b;}
.editBtn.active{background:#f59e0b;}

#searchControls,#editControl,#coordsControl,#layersControl{
position:absolute;z-index:1000;
}
#searchControls{top:15px;left:15px;display:flex;gap:5px;}
#editControl{top:60px;left:15px;display:flex;flex-direction:column;gap:6px;}
#coordsControl{bottom:15px;left:15px;}
#layersControl{bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}

#map.coords-mode, #map.coords-mode * { cursor: crosshair !important; }

.copy-btn{margin-left:8px;padding:2px 6px;font-size:12px;}

#confirmBox{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#fff;padding:20px;border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
z-index:2000;display:none;width:300px;text-align:center;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="searchControls">
<input id="searchInput" placeholder="Пошук…">
<button id="resetSearch">✖</button>
</div>

<div id="editControl">
<button id="addPolygonBtn">Додати</button>
<button id="editPolygonBtn">Редагувати вершини</button>
<button id="deletePolygonBtn">Видалити</button>
</div>

<div id="coordsControl">
<button id="coordsModeBtn">Координати</button>
</div>

<div id="layersControl">
<button id="googleBtn" class="active">Google</button>
<button id="gkkBtn">GKK</button>
<button id="esriBtn">ESRI</button>
<button id="str_mapBtn">STR_MAP</button>
</div>

<div id="infoPanel">
<div id="infoHeader">
<b>Інформація</b>
<button id="closeInfo">✖</button>
</div>
<div id="infoContent"></div>
</div>

<div id="confirmBox">
  <div style="margin-bottom:15px;font-weight:600;">
    Видалити полігон?
  </div>
  <div style="display:flex;justify-content:center;gap:10px;">
    <button id="confirmYes" style="background:#ef4444;">Так</button>
    <button id="confirmNo">Скасувати</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-geometryutil@0.10.1/src/leaflet.geometryutil.js"></script>

<script>

const map=L.map('map').setView([48.680987,31.086159],12);
map.zoomControl.remove();
L.control.zoom({position:'bottomright'}).addTo(map);

const googleLayer=L.tileLayer('https://www.google.com/maps/vt?lyrs=s@189&x={x}&y={y}&z={z}').addTo(map);
const gkkLayer=L.tileLayer('https://map50.gki.com.ua/api-user/rtile/carto_2240035321813140995/ua/{z}/{x}/{y}.png');
const esriLayer=L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
const str_mapLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

function toggleLayer(name){
[googleLayer,gkkLayer,esriLayer,str_mapLayer].forEach(l=>l.remove());
document.querySelectorAll('#layersControl button').forEach(b=>b.classList.remove('active'));
if(name==='google'){googleLayer.addTo(map);googleBtn.classList.add('active');}
if(name==='gkk'){gkkLayer.addTo(map);gkkBtn.classList.add('active');}
if(name==='esri'){esriLayer.addTo(map);esriBtn.classList.add('active');}
if(name==='str_map'){str_mapLayer.addTo(map);str_mapBtn.classList.add('active');}
}
googleBtn.onclick=()=>toggleLayer('google');
gkkBtn.onclick=()=>toggleLayer('gkk');
esriBtn.onclick=()=>toggleLayer('esri');
str_mapBtn.onclick=()=>toggleLayer('str_map');

const editableLayer=new L.FeatureGroup().addTo(map);

const drawControlFull = new L.Control.Draw({
  edit: { featureGroup: editableLayer },
  draw: false
});
map.addControl(drawControlFull);

let activeLayer=null;
let editMode=false;

/* Далі код продовжується... */
