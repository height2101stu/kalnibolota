<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадастрова карта</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<style>
:root { --btn-base:#5aa0e5; --btn-hover:#3f7fc1; --btn-active:#f59e0b; }
html,body,#map{width:100%;height:100%;margin:0;}

#infoPanel{
position:absolute;top:15px;right:15px;width:360px;
background:#fff;padding:14px;border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
font-size:14px;z-index:1000;display:none;
}
#infoPanel.visible{display:block;}

#infoHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
#infoContent table{width:100%;border-collapse:separate;border-spacing:0 6px;}
#infoContent td:first-child{width:140px;font-weight:500;}
td.value{background:#f0f4ff;padding:6px 8px;border-radius:6px;}
td.value.active{background:#dbeafe;}

button,.rowEditBtn{
border:none;border-radius:6px;padding:6px 10px;
background:var(--btn-base);color:#fff;
cursor:pointer;font-size:13px;
}
button:hover,.rowEditBtn:hover{background:var(--btn-hover);}
button.active,.rowEditBtn.active{background:var(--btn-active);}

#searchControls,#editControl,#coordsControl,#layersControl{
position:absolute;z-index:1000;
}
#searchControls{top:15px;left:15px;display:flex;gap:5px;}
#editControl{top:60px;left:15px;display:flex;flex-direction:column;gap:6px;}
#coordsControl{bottom:15px;left:15px;}
#layersControl{bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}

#map.coords-mode, #map.coords-mode * { cursor: crosshair !important; }
.copy-btn{margin-left:8px;padding:2px 6px;font-size:12px;}
</style>
</head>

<body>

<div id="map"></div>

<div id="searchControls">
<input id="searchInput" placeholder="Пошук…">
<button id="resetSearch">✖</button>
</div>

<div id="editControl">
<button id="addPolygonBtn">Додати</button>
<button id="editPolygonBtn">Редагувати вершини</button>
<button id="deletePolygonBtn">Видалити</button>
</div>

<div id="coordsControl">
<button id="coordsModeBtn">Координати</button>
</div>

<div id="layersControl">
<button id="googleBtn" class="active">Google</button>
<button id="gkkBtn">GKK</button>
<button id="esriBtn">ESRI</button>
<button id="str_mapBtn">STR_MAP</button>
</div>

<div id="infoPanel">
<div id="infoHeader">
<b>Інформація</b>
<button id="closeInfo">✖</button>
</div>
<div id="infoContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-geometryutil@0.10.1/src/leaflet.geometryutil.js"></script>

<script>

const map=L.map('map').setView([48.670956, 31.122379],20);
map.zoomControl.remove();
L.control.zoom({position:'bottomright'}).addTo(map);

/* ===== ПІДКЛАДКИ ===== */

const googleLayer=L.tileLayer('https://www.google.com/maps/vt?lyrs=s@189&x={x}&y={y}&z={z}').addTo(map);
const gkkLayer=L.tileLayer('https://map50.gki.com.ua/api-user/rtile/carto_2240035321813140995/ua/{z}/{x}/{y}.png');
const esriLayer=L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
const str_mapLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

function toggleLayer(name){
[googleLayer,gkkLayer,esriLayer,str_mapLayer].forEach(l=>l.remove());
document.querySelectorAll('#layersControl button').forEach(b=>b.classList.remove('active'));
if(name==='google'){googleLayer.addTo(map);googleBtn.classList.add('active');}
if(name==='gkk'){gkkLayer.addTo(map);gkkBtn.classList.add('active');}
if(name==='esri'){esriLayer.addTo(map);esriBtn.classList.add('active');}
if(name==='str_map'){str_mapLayer.addTo(map);str_mapBtn.classList.add('active');}
}
googleBtn.onclick=()=>toggleLayer('google');
gkkBtn.onclick=()=>toggleLayer('gkk');
esriBtn.onclick=()=>toggleLayer('esri');
str_mapBtn.onclick=()=>toggleLayer('str_map');

/* ===== ДАНІ ===== */

const editableLayer=new L.FeatureGroup().addTo(map);
let activeLayer=null;

/* ===== КАДАСТРОВИЙ НОМЕР ===== */

function generateCadnum(){
let num;
do{
num=`3523681200:${Math.floor(Math.random()*100000000)
.toString()
.padStart(8,'0')}`;
}while(isCadnumExists(num));
return num;
}
function isCadnumExists(num){
let exists=false;
editableLayer.eachLayer(l=>{
if(l.feature?.properties?.Cadnum===num) exists=true;
});
return exists;
}

/* ===== СТИЛЬ ===== */

function stylePolygon(){return{color:'#3388ff',fillColor:'#3388ff',fillOpacity:0.15};}
function highlight(l){l.setStyle({fillColor:'#ffe066',fillOpacity:0.5});}

/* ===== ЗАВАНТАЖЕННЯ ===== */

fetch('/polygons.json')
.then(r=>r.json())
.then(d=>{
if(!d||!d.features)return;
L.geoJSON(d,{
style:stylePolygon,
onEachFeature:(f,l)=>{
editableLayer.addLayer(l);
l.on('click',()=>selectLayer(l));
}
});
});

/* ===== ДОДАВАННЯ ===== */

const drawControl=new L.Draw.Polygon(map,{allowIntersection:false,shapeOptions:stylePolygon()});
addPolygonBtn.onclick=()=>drawControl.enable();

map.on(L.Draw.Event.CREATED,e=>{
const l=e.layer;
const ll=l.getLatLngs()[0];
l.feature={
type:'Feature',
properties:{
Cadnum:generateCadnum(),
Area:'',
area_2:+(L.GeometryUtil.geodesicArea(ll)/10000).toFixed(4),
purpose:'',
owner:'',
note:''
},
geometry:{type:'Polygon',coordinates:[ll.map(p=>[p.lng,p.lat])]}
};
editableLayer.addLayer(l);
selectLayer(l);
saveAll();
});

/* ===== ВИБІР ===== */

function selectLayer(l){
activeLayer=l;
editableLayer.eachLayer(x=>x.setStyle(stylePolygon()));
highlight(l);
showInfo(l);
}

/* ===== ПАНЕЛЬ ===== */

function showInfo(layer){
const p=layer.feature.properties;
let html='<table>';
for(const k in p){
html+=`
<tr>
<td>${k}</td>
<td class="value" contenteditable="${k!=='Cadnum'}" data-key="${k}">
${p[k]??''}
</td>
</tr>`;
}
html+='</table>';
infoContent.innerHTML=html;
infoPanel.classList.add('visible');

document.querySelectorAll('.value').forEach(td=>{
td.onblur=()=>{
layer.feature.properties[td.dataset.key]=td.innerText.trim();
saveAll();
};
});
}
closeInfo.onclick=()=>infoPanel.classList.remove('visible');

/* ===== РЕДАГУВАННЯ ===== */

editPolygonBtn.onclick=()=>{
if(!activeLayer)return;
if(!activeLayer.editing.enabled()){
activeLayer.editing.enable();
}else{
activeLayer.editing.disable();
const ll=activeLayer.getLatLngs()[0];
activeLayer.feature.properties.area_2=
+(L.GeometryUtil.geodesicArea(ll)/10000).toFixed(4);
showInfo(activeLayer);
saveAll();
}
};

/* ===== ВИДАЛЕННЯ ===== */

deletePolygonBtn.onclick=()=>{
if(activeLayer){
editableLayer.removeLayer(activeLayer);
infoPanel.classList.remove('visible');
activeLayer=null;
saveAll();
}
};

/* ===== ПОШУК + RESET ===== */

searchInput.oninput=e=>{
const q=e.target.value.toLowerCase();
editableLayer.eachLayer(l=>{
const m=Object.values(l.feature.properties)
.some(v=>v && v.toString().toLowerCase().includes(q));
l.setStyle(m?{fillColor:'#22c55e',fillOpacity:0.6}:stylePolygon());
});
};

resetSearch.onclick=()=>{
searchInput.value='';
editableLayer.eachLayer(l=>l.setStyle(stylePolygon()));
infoPanel.classList.remove('visible');
activeLayer=null;
};

/* ===== КООРДИНАТИ ===== */

let coordsMode=false;
let coordMarker=null;

coordsModeBtn.onclick=()=>{
coordsMode=!coordsMode;
coordsModeBtn.classList.toggle('active',coordsMode);
map.getContainer().classList.toggle('coords-mode',coordsMode);
if(!coordsMode && coordMarker){
map.removeLayer(coordMarker);
coordMarker=null;
}
};

map.on('click',e=>{
if(!coordsMode)return;

if(coordMarker) map.removeLayer(coordMarker);
coordMarker=L.marker(e.latlng).addTo(map);

const lat=e.latlng.lat.toFixed(6);
const lng=e.latlng.lng.toFixed(6);
const text=`${lat}, ${lng}`;

infoContent.innerHTML=`
<table>
<tr>
<td>Координати</td>
<td class="value">
${text}
<button id="copyCoordsBtn" class="copy-btn">📋</button>
</td>
</tr>
</table>
`;

infoPanel.classList.add('visible');

document.getElementById('copyCoordsBtn').onclick=()=>{
navigator.clipboard.writeText(text);
const btn=document.getElementById('copyCoordsBtn');
btn.innerText='✔';
setTimeout(()=>btn.innerText='📋',1000);
};
});

/* ===== ЗБЕРЕЖЕННЯ ===== */

function saveAll(){
fetch('/polygons',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(editableLayer.toGeoJSON())
});
}

</script>
</body>
</html>
